<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Fuse Core</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        li {
            display: inline-block;
            padding: 15px;
            border: 0.2rem solid white;
            border-radius: 100%;
            margin-right: 3.5rem;
            margin-bottom: 0.3rem;
            font-size: 2.7rem;
            overflow: hidden;
        }

        .fondo {
            width: 100vw;
            height: 100vh;
            background-image: url("../Imagenes/background-jensen.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            overflow: hidden;

            text-align: center;
        }

        .contenido {
            box-sizing: border-box;
            padding-top: 6vh;
            height: 55vh;
            background-color: rgba(0, 0, 0, 0.5);
            color: white
        }

        .centrado {
            border-radius: 50%;
            height: 19vh;
            border: 2px solid white;
        }

        .fuse {
            font-size: 5rem;
            padding: 0.4rem 0;
        }

        .subtitulo {
            font-size: 1.89rem;
            padding: 0rem 0;
            padding-bottom: 2.3rem;
        }

        .final {
            padding-top: 3rem;
            font-size: 1.6rem;
        }

        .pie {
            color: rgb(158, 158, 158);
            font-size: 1.3rem;
            margin-top: auto;
        }
    </style>
</head>

<body>
    <div class="fondo">
        <div class="contenido">
            <img class="centrado" src="../Imagenes/Icono_avatar.png" alt="">
            <h2 class="fuse">Fuse Core</h2>
            <p class="subtitulo">Frontend Developer</p>
            <ul>
                <li><i class="fa-brands fa-x-twitter" style="color: rgb(255, 255, 255);"></i></li>
                <li><i class="fa-brands fa-weibo" style="color: rgb(255, 255, 255);"></i></li>
                <li><i class="fa-brands fa-gitlab" style="color: rgb(255, 255, 255);"></i></li>
                <li><i class="fa-brands fa-github" style="color: rgb(255, 255, 255);"></i></li>
                <li><i class="fa-solid fa-book-open" style="color: rgb(255, 255, 255);"></i></li>
                <li><i class="fa-solid fa-envelope" style="color: rgb(255, 255, 255);"></i></li>
                <li><i class="fa-solid fa-key" style="color: rgb(255, 255, 255);"></i></li>
            </ul>
            <p class="final">
                Any (multiline) text containing simple HTML, such as links or ... lorem ipsum.
            </p>
        </div>
        <footer>
            <div class="pie">
                <p>
                    Built on the Fuse Core Jekyll theme.
                </p>
            </div>
        </footer>
    </div>


</body>

</html>
