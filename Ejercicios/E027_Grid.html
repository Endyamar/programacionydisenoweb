<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>

    <style>
        .contenedor {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 10px;
        }

        .contenedor div {
            border: 1px solid blue;
            height: 200px;
        }

        .areas {
            display: grid;
            grid-template-areas:
                "cabecera cabecera cabecera"
                "lateral principal principal"
                "pie pie pie";
        }
        .cabecera{
            grid-area:cabecera;
            background-color: red;
            height: 100px;
        }
        .lateral{
            grid-area:lateral;
            background-color: blue;
            height: 500px;
        }
        .principal{
            grid-area:principal;
            background-color: green;
            height: 500px;
        }
        .pie{
            grid-area:pie;
            background-color: orange;
            height: 100px;
        }

    </style>
</head>

<body>

    <div class="areas">
        <div class="cabecera">Cabecera</div>
        <div class="lateral">Lateral</div>
        <div class="principal">Principal</div>
        <div class="pie">Pie</div>
    </div>
