<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción a flex</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
        }

        .contenedor {
            display: flex;
            flex-direction: row;

            /* disposición horizontal */
            justify-content: center;

            /* disposición vertil */
            align-items: center;

            border: 1px solid red;
            padding: 1rem;
            height: 100vh;
            gap: 1rem;
            flex-wrap: nowrap;
        }

        div {
            height: 200px;
            width: 500px;
            border: 1px solid blue;
            font-size: 3rem;
        }

        .numero {
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .uno {
            flex-grow: 1;
            flex-basis: 800px;
        }

        .dos {
            flex-shrink: 3;
        }

        .tres {
            flex-grow: 3;
        }
    </style>
</head>

<body>
    <section class="contenedor">
        <div class="numero uno">1</div>
        <div class="numero dos">2</div>
        <div class="numero tres">3</div>


    </section>
</body>

</html>
