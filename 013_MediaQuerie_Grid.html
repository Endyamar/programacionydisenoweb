<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>

*{
    margin: 0;
    padding: 0;
box-sizing: border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background-color: aliceblue;
    padding: 20px;
        background-color: rgb(159, 206, 159);

}
.contenedor{
    display: grid;
    grid-template-columns: 250px 1fr;

    grid-template-areas:
    "header header"
    "menu content"
    "ads content"
    "footer footer";

    gap: 20px;
}

.header{
    grid-area: header;
    background-color: green;
}

.menu{
    grid-area: menu;
    background-color: rgb(22, 83, 22);
}

.content{
grid-area: content;
background-color: rgb(84, 141, 84);
}

.ads{
    grid-area: ads;
    background-color: rgb(104, 133, 61);
}

.footer{
    grid-area: footer;
    background-color: rgb(50, 68, 24);
}
.box{
    color: white;
    padding: 40px;
    font-size: 1.5rem;
    font-weight: bold;
    text-align: center;
    border-radius: 10px;
}

/* TABLET */
@media (max-width:1200px){
    .contenedor{
        grid-template-columns: 1fr;
        grid-template-areas:
        "header header"
        "menu content"
        "ads footer";
    }
}

@media (max-width:900px){
    .contenedor{
        grid-template-columns: 1fr;
        grid-template-areas:
        "header"
        "menu"
        "content"
        "ads"
        "footer";
    }
}

</style>


</head>
<body>
    <div class="contenedor">
        <header class="header box">HEADER</header>
        <nav class="menu box">MENU</nav>
        <main class="content box">CONTENIDO</main>
        <aside class="ads box">PUBLICIDAD</aside>
        <footer class="footer box">PIE</footer>
    </div>
</body>
</html>
